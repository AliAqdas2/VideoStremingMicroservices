<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Video Streaming Platform</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎬 Short Video Streaming Platform</h1>
            <div id="auth-section">
                <form id="login-form" class="auth-form" onsubmit="event.preventDefault(); login();">
                    <h2>Login</h2>
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p>Don't have an account? <a href="#" onclick="event.preventDefault(); showRegister();">Register</a></p>
                </form>
                <form id="register-form" class="auth-form" style="display: none;" onsubmit="event.preventDefault(); register();">
                    <h2>Register</h2>
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit">Register</button>
                    <p>Already have an account? <a href="#" onclick="event.preventDefault(); showLogin();">Login</a></p>
                </form>
                <div id="user-info" style="display: none;">
                    <span id="username-display"></span>
                    <button onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" style="display: none;">
            <!-- Dashboard -->
            <section id="dashboard">
                <h2>Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Storage Usage</h3>
                        <div class="progress-bar">
                            <div id="storage-progress" class="progress-fill"></div>
                        </div>
                        <p id="storage-text">0 MB / 50 MB</p>
                    </div>
                    <div class="stat-card">
                        <h3>Daily Bandwidth</h3>
                        <div class="progress-bar">
                            <div id="bandwidth-progress" class="progress-fill"></div>
                        </div>
                        <p id="bandwidth-text">0 MB / 100 MB</p>
                    </div>
                </div>
            </section>

            <!-- Upload Section -->
            <section id="upload-section">
                <h2>Upload Video</h2>
                <div class="upload-area">
                    <input type="file" id="video-input" accept="video/*" style="display: none;">
                    <button onclick="document.getElementById('video-input').click()">Choose Video</button>
                    <span id="selected-file"></span>
                    <button id="upload-btn" onclick="uploadVideo()" disabled>Upload</button>
                </div>
                <div id="upload-status"></div>
            </section>

            <!-- Video Gallery -->
            <section id="video-gallery">
                <h2>My Videos</h2>
                <div id="videos-container" class="videos-grid">
                    <!-- Videos will be loaded here -->
                </div>
                <div id="bulk-actions" style="display: none;">
                    <button onclick="bulkDelete()">Delete Selected</button>
                    <button onclick="clearSelection()">Clear Selection</button>
                </div>
            </section>
        </main>

        <!-- Alert Messages -->
        <div id="alert-container"></div>
    </div>

</body>
</html>
