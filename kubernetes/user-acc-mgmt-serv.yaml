apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-acc-mgmt-serv
  namespace: videostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-acc-mgmt-serv
  template:
    metadata:
      labels:
        app: user-acc-mgmt-serv
    spec:
      containers:
      - name: user-acc-mgmt-serv
        image: gcr.io/YOUR_PROJECT_ID/user-acc-mgmt-serv:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/videostream_users"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: LOGGING_SERVICE_URL
          value: "http://logging-serv:3006"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-acc-mgmt-serv
  namespace: videostream
spec:
  selector:
    app: user-acc-mgmt-serv
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

