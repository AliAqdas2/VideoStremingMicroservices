apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-pvc
  namespace: videostream
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-mgmt-serv
  namespace: videostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-mgmt-serv
  template:
    metadata:
      labels:
        app: storage-mgmt-serv
    spec:
      containers:
      - name: storage-mgmt-serv
        image: gcr.io/YOUR_PROJECT_ID/storage-mgmt-serv:latest
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/videostream_storage"
        - name: STORAGE_DIR
          value: "/app/uploads"
        - name: LOGGING_SERVICE_URL
          value: "http://logging-serv:3006"
        volumeMounts:
        - name: storage-volume
          mountPath: /app/uploads
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: storage-mgmt-serv
  namespace: videostream
spec:
  selector:
    app: storage-mgmt-serv
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP

