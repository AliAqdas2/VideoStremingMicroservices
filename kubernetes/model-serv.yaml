apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serv
  namespace: videostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serv
  template:
    metadata:
      labels:
        app: model-serv
    spec:
      containers:
      - name: model-serv
        image: gcr.io/YOUR_PROJECT_ID/model-serv:latest
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        - name: USER_SERVICE_URL
          value: "http://user-acc-mgmt-serv:3001"
        - name: STORAGE_SERVICE_URL
          value: "http://storage-mgmt-serv:3002"
        - name: USAGE_SERVICE_URL
          value: "http://usage-mntr-serv:3003"
        - name: LOGGING_SERVICE_URL
          value: "http://logging-serv:3006"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: model-serv
  namespace: videostream
spec:
  selector:
    app: model-serv
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP

