apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: videostream
data:
  gcs-bucket-name: "videostream-videos"
  gcp-project-id: "YOUR_PROJECT_ID"
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-storage-key
  namespace: videostream
type: Opaque
stringData:
  key.json: |
    # Paste your GCP service account JSON key here
    # Or use: kubectl create secret generic gcp-storage-key --from-file=key.json=/path/to/service-account-key.json --namespace=videostream

