apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-mntr-serv
  namespace: videostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usage-mntr-serv
  template:
    metadata:
      labels:
        app: usage-mntr-serv
    spec:
      containers:
      - name: usage-mntr-serv
        image: gcr.io/cloud-project-video-streaming/usage-mntr-serv:latest
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/videostream_usage"
        - name: LOGGING_SERVICE_URL
          value: "http://logging-serv:3006"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: usage-mntr-serv
  namespace: videostream
spec:
  selector:
    app: usage-mntr-serv
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP


