apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-serv
  namespace: videostream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-serv
  template:
    metadata:
      labels:
        app: logging-serv
    spec:
      containers:
      - name: logging-serv
        image: gcr.io/cloud-project-video-streaming/logging-serv:latest
        ports:
        - containerPort: 3006
        env:
        - name: PORT
          value: "3006"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/videostream_logs"
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: logging-serv
  namespace: videostream
spec:
  selector:
    app: logging-serv
  ports:
  - port: 3006
    targetPort: 3006
  type: ClusterIP


